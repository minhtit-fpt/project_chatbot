services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      OBSIDIAN_VAULT_PATH: /vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /root/obsidian-vault:/vault:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
